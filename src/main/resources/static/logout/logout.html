<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注销与设备管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        /* 1. 核心修改：设置固定背景图片 */
        body {
            background-image: url('/images/logout.png'); /* 您的背景图片路径 */
            background-size: cover; /* 铺满整个屏幕 */
            background-repeat: no-repeat; /* 不重复 */
            background-attachment: fixed; /* 固定背景，不随内容滚动 */
            margin: 0;
            padding: 30px 0;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center; /* 水平居中 */
        }

        /* 2. 主容器设置半透明背景 */
        .container {
            width: 90%;
            max-width: 700px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            background-color: rgba(255, 255, 255, 0.85); /* 半透明白色 */
        }

        .card {
            border: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .alert-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            display: none; /* 默认隐藏 */
        }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center mb-4">🚪 账户与设备注销中心</h2>

    <div id="messageBox" class="alert-message alert-info text-center"></div>

    <div class="card mb-4 p-3">
        <h3 class="card-title text-center text-primary">安全退出系统</h3>
        <p class="text-center">这将清除您的登录状态，返回到登录页面。</p>
        <button id="logoutBtn" class="btn btn-primary w-100">立即退出登录</button>
    </div>

    <div class="card mb-4 p-3 border-warning">
        <h3 class="card-title text-center text-warning">⚠ 删除单个设备及其数据</h3>
        <p class="text-danger">**警告：** 删除后，该设备的所有历史传感器数据将**永久丢失**。</p>
        <div class="mb-3">
            <label for="deviceIdSelect" class="form-label">选择要删除的设备:</label>
            <select id="deviceIdSelect" class="form-select">
                <option value="">-- 请加载设备列表 --</option>
            </select>
        </div>
        <button id="deleteDeviceBtn" class="btn btn-warning w-100">删除选中设备</button>
    </div>

    <div class="card mb-4 p-3 border-success">
        <h3 class="card-title text-center text-success">🔑 修改登录密码</h3>
        <p class="text-center text-muted">点击下方按钮展开密码修改表单。</p>
        <button class="btn btn-outline-success w-100 mb-0" type="button" data-bs-toggle="collapse" data-bs-target="#changePasswordPanel" aria-expanded="false" aria-controls="changePasswordPanel">
            点击展开 / 收起
        </button>
        <div id="changePasswordPanel" class="collapse mt-3">
            <div class="mb-3">
                <label for="oldPassword" class="form-label">当前密码:</label>
                <input type="password" id="oldPassword" class="form-control" placeholder="请输入当前密码">
            </div>
            <div class="mb-3">
                <label for="newPassword" class="form-label">新密码 (至少6位):</label>
                <input type="password" id="newPassword" class="form-control" placeholder="请输入新密码">
            </div>
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">确认新密码:</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="请再次输入新密码">
            </div>
            <button id="changePasswordBtn" class="btn btn-success w-100">确认修改密码</button>
        </div>
    </div>

    <div class="card p-3 border-danger">
        <h3 class="card-title text-center text-danger">🚨 彻底注销用户账户</h3>
        <p class="text-danger">**严重警告：** 此操作将**永久删除**您的用户账户、所有绑定设备及其产生的**全部数据**。此操作不可逆！</p>
        <button id="deleteUserBtn" class="btn btn-danger w-100">注销我的账户 (需密码确认)</button>
    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('logoutBtn').addEventListener('click', handleLogout);
        document.getElementById('deleteDeviceBtn').addEventListener('click', handleDeleteDevice);
        document.getElementById('deleteUserBtn').addEventListener('click', handleDeleteUser);
        document.getElementById('changePasswordBtn').addEventListener('click', handleChangePassword);
        fetchDeviceList();
    });

    /**
     * 显示消息提示
     */
    function showMessage(msg, type) {
        const box = document.getElementById('messageBox');
        box.className = `alert-message text-center alert-${type === 'error' ? 'danger' : (type === 'success' ? 'success' : 'info')}`;
        box.textContent = msg;
        box.style.display = 'block';
        setTimeout(() => {
            box.style.display = 'none';
        }, 5000);
    }

    /**
     * 获取用户绑定的设备列表并填充下拉框
     */
    async function fetchDeviceList() {
        const selectEl = document.getElementById('deviceIdSelect');
        selectEl.innerHTML = '<option value="">-- 正在加载... --</option>';

        try {
            const response = await fetch('/api/my-devices-for-logout');
            if (response.status === 401) {
                // 未登录，直接跳转
                window.location.href = "/login/login.html";
                return;
            }
            const devices = await response.json();

            selectEl.innerHTML = '<option value="">-- 请选择要删除的设备 --</option>';
            if (devices && devices.length > 0) {
                devices.forEach(device => {
                    const option = document.createElement('option');
                    option.value = device.device_unique_id;
                    option.textContent = `${device.device_name} (${device.device_unique_id})`;
                    selectEl.appendChild(option);
                });
            } else {
                selectEl.innerHTML = '<option value="">-- 当前无绑定设备 --</option>';
                document.getElementById('deleteDeviceBtn').disabled = true;
            }

        } catch (error) {
            console.error('加载设备列表失败:', error);
            selectEl.innerHTML = '<option value="">-- 加载设备列表失败 --</option>';
            showMessage('加载设备列表失败，请检查网络或重新登录', 'error');
        }
    }

    // ... handleLogout & handleDeleteDevice 保持不变 ...

    /**
     * 处理安全退出登录
     */
    async function handleLogout() {
        if (!confirm('您确定要安全退出系统吗？')) {
            return;
        }
        try {
            const response = await fetch('/api/logout', { method: 'POST' });
            if (response.ok) {
                showMessage('退出成功，正在跳转...', 'success');
                setTimeout(() => { window.location.href = "/login/login.html"; }, 1000);
            } else {
                const data = await response.json();
                showMessage(data.message || '退出登录失败', 'error');
            }
        } catch (error) {
            showMessage('网络请求错误，无法退出', 'error');
        }
    }

    /**
     * 处理删除指定设备
     */
    async function handleDeleteDevice() {
        const selectEl = document.getElementById('deviceIdSelect');
        const deviceId = selectEl.value;

        if (!deviceId) {
            showMessage('请先选择一个要删除的设备！', 'error');
            return;
        }

        if (!confirm(`您确定要永久删除设备 [${deviceId}] 及其所有数据吗？此操作不可逆！`)) {
            return;
        }

        try {
            const response = await fetch(`/api/delete-device/${deviceId}`, { method: 'DELETE' });
            const data = await response.json();

            if (response.ok) {
                showMessage(data.message, 'success');
                fetchDeviceList();
            } else {
                showMessage(data.message || '删除设备失败', 'error');
            }
        } catch (error) {
            showMessage('网络请求错误，删除设备失败', 'error');
        }
    }


    /**
     * 处理修改密码
     */
    async function handleChangePassword() {
        const oldPassword = document.getElementById('oldPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (!oldPassword || !newPassword || !confirmPassword) {
            showMessage('请填写所有密码字段！', 'error');
            return;
        }
        if (newPassword.length < 6) {
            showMessage('新密码长度至少需要6位！', 'error');
            return;
        }
        if (newPassword !== confirmPassword) {
            showMessage('两次输入的新密码不一致！', 'error');
            return;
        }

        try {
            const response = await fetch('/api/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ oldPassword, newPassword })
            });
            const data = await response.json();

            if (response.ok) {
                showMessage('密码修改成功！', 'success');
                document.getElementById('oldPassword').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmPassword').value = '';
            } else if (response.status === 403) {
                showMessage('修改失败：当前密码不正确。', 'error');
            } else {
                showMessage(data.message || '修改密码失败', 'error');
            }
        } catch (error) {
            showMessage('网络请求错误，修改密码失败', 'error');
        }
    }

    /**
     * ⭐️ 修正点：处理注销用户账户，增加密码确认
     */
    async function handleDeleteUser() {
        if (!confirm('⚠️ 最终确认：您确定要永久注销您的账户和所有关联数据吗？数据将无法恢复！')) {
            return;
        }

        const password = prompt('为了安全，请在此输入您的登录密码以确认注销操作：');
        if (!password) {
            showMessage('未输入密码，注销操作已取消。', 'info');
            return;
        }

        try {
            const response = await fetch('/api/delete-user', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: password }) // 传递密码
            });

            const data = await response.json();

            if (response.ok) {
                showMessage('账户注销成功，正在跳转到登录页...', 'success');
                // 成功后跳转
                setTimeout(() => {
                    window.location.href = "/login/login.html";
                }, 2000);
            } else if (response.status === 403) {
                showMessage('注销失败：密码不正确。', 'error');
            } else {
                showMessage(data.message || '注销用户失败', 'error');
            }
        } catch (error) {
            console.error('注销用户失败:', error);
            showMessage('网络请求错误，注销失败', 'error');
        }
    }
</script>
</body>
</html>
